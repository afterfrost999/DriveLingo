org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 말차는 Pleos Connect 앱이다. 기본 빌드는 Pleos Connect 에뮬레이터·차량용 실연동 빌드다.
# 차량 신호: car(기본, CarUx·Vehicle SDK·CarProperty·AudioManager 실연동) | mock(일반 Android 에뮬레이터·CI 용 대체)
drivelingo.vehicleSource=car
# 음성: pleos(기본, Pleos SpeechToText/TextToSpeech) | simulated(Pleos 음성 서비스가 없는 환경용, 소리 없음)
drivelingo.voiceSource=pleos
