org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 차량 신호 소스: mock(기본) | car (AAOS CarUxRestrictions 실제 연동 + 나머지 신호는 Mock)
drivelingo.vehicleSource=mock
# 음성: simulated(기본, 소리 없이 시간만 흐름) | pleos (Pleos SpeechToText/TextToSpeech 실연동)
drivelingo.voiceSource=simulated
